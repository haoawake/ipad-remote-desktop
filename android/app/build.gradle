plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.haoawake.remotedesktop'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.haoawake.remotedesktop'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:3.14.9'
}
