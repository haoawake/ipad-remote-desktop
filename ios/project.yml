name: iPadRemote
options:
  bundleIdPrefix: com.haoawake
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "2"
targets:
  iPadRemote:
    type: application
    platform: iOS
    sources:
      - path: iPadRemote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.haoawake.ipadremote
        SUPPORTS_MACCATALYST: NO
    info:
      path: iPadRemote/Info.plist
      properties:
        CFBundleDisplayName: iPad 远程桌面
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UIApplicationSupportsIndirectInputEvents: true
        UIRequiresFullScreen: true
        NSLocalNetworkUsageDescription: 访问同一网络或 Tailscale 内网中的远程电脑
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
